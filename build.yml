name: Build MobileFruity

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 8 is the last one whose javac still accepts -source 1.3 / -target 1.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download J2ME API jars (MicroEmulator, Maven Central)
        run: |
          mkdir -p libs
          B=https://repo1.maven.org/maven2/org/microemu
          for a in microemu-cldc microemu-midp microemu-jsr-75 microemu-jsr-135; do
            wget -q -P libs "$B/$a/2.0.4/$a-2.0.4.jar" || echo "MISSING: $a"
          done
          ls -l libs

      - name: Compile
        run: |
          mkdir -p classes
          CP=$(ls libs/*.jar | tr '\n' ':')
          javac -source 1.3 -target 1.3 -encoding UTF-8 -classpath "$CP" -d classes *.java

      - name: Package jar
        run: jar cvfm MobileFruity.jar MANIFEST.MF -C classes .

      - uses: actions/upload-artifact@v4
        with:
          name: MobileFruity
          path: MobileFruity.jar
